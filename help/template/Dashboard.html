<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tour Dashboard</title>
        <link rel="stylesheet" href="Styles.css">
        <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="p-5">
        <div id="customJsTooltip"></div>
        <h2 id="dashboardTitle" class="text-4xl text-center font-bold">Tour Dashboard</h2>
        <p id="lastUpdatedSubtitle" class="text-xl text-center font-bold mb-1">Last updated: Some time ago</p>
        <div id="tabContainer" class="border-b flex justify-center mb-1">
            <button id="langToggleBtn" class="tab-btn" style="width: 40px; background-color: black; color: white;" onclick="toggleSearchLanguage()">JP</button>
            <button class="tab-btn active-tab" onclick="switchDashboardTab(event, 'player-tab')">Player</button>
            <button id="tourTabBtn" class="tab-btn" onclick="switchDashboardTab(event, 'tour-tab')">Tour</button>
            <div id="globalHelpWrapper" class="relative">
                <button class="tab-btn" style="width: 40px; background-color: black; color: white;" onclick="toggleGlobalHelp(event)">?</button>
                <div id="playerGuideDropdown" class="bg-white border p-4 w-[500px] absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black"></div>
                <div id="tierGuideDropdown" class="bg-white border p-4 w-[450px] absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black"></div>
                <div id="guessGuideDropdown" class="bg-white border p-4 w-[450px] absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black"></div>
                <div id="songGuideDropdown" class="bg-white border p-4 w-[450px] absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black"></div>
                <div id="searchGuideDropdown" class="bg-white border p-4 w-[450px] absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black"></div>
            </div>
            <div id="globalGearWrapper" class="relative">
                <button class="tab-btn" style="width: 40px; background-color: black; color: white;" onclick="toggleGlobalGear(event)">⚙</button>
                <div id="playerColumnSettingsDropdown" class="bg-white border p-4 min-w-44 absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black flex flex-col gap-1">
                    <div id="playerMetricModeSection" class="hidden">
                        <p class="font-bold pb-1 mb-1">Display</p>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="playerMetricModeRadio" value="%" checked class="accent-black">Current</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="playerMetricModeRadio" value="Δ" class="accent-black">Delta</label>
                        <div class="border-b my-1.5"></div>
                    </div>
                    <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-black">
                        <input type="checkbox" id="playerAllColumnsMasterCheckbox" class="rounded accent-black">All
                    </label>
                    <div id="playerColumnCheckboxContainer" class="flex flex-col gap-0.5 text-xs max-h-[400px] overflow-y-auto"></div>
                </div>
                <div id="columnSettingsDropdown" class="bg-white border p-4 w-36 absolute right-0 top-[32px] hidden z-50 shadow-md">
                    <label class="flex items-center gap-2 cursor-pointer border-b pb-2 mb-2 font-bold text-sm">
                        <input type="checkbox" id="allColumnsMasterCheckbox" class="rounded accent-black">All
                    </label>
                    <div id="columnCheckboxContainer" class="flex flex-col gap-0.5 text-sm max-h-[400px] overflow-y-auto"></div>
                </div>
                <div id="tierSettingsDropdown" class="bg-white border p-4 w-44 absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black flex flex-col gap-1">
                    <div>
                        <p class="font-bold border-b pb-1 mb-1">Sort</p>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="tierSortRadio" value="ALL" class="accent-black">Global</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="tierSortRadio" value="TIER" checked class="accent-black">Tier</label>
                    </div>
                    <div>
                        <p class="font-bold border-b pb-1 mb-1">Display</p>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="tierDisplayRadio" value="COUNT" class="accent-black">Count</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="tierDisplayRadio" value="RATE" checked class="accent-black">Rate</label>
                    </div>
                    <div>
                        <p class="font-bold border-b pb-1 mb-1">Chart</p>
                        <div class="flex flex-col gap-1">
                            <label class="flex items-center gap-1 cursor-pointer font-bold mt-1">
                                <input type="radio" name="tierChartGroupRadio" value="C1" checked class="accent-black">
                                <span id="label_group_c1">General</span>
                            </label>
                            <div class="pl-2 flex flex-col gap-0.5 border-l-2 border-gray-200 ml-1">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierSubMetricsRadio" value="BASE" checked class="accent-black"><span id="opt_c1_base">Guess Rate</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierSubMetricsRadio" value="OVER-8" class="accent-black"><span id="opt_c1_over8">Over-8 Distribution</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierSubMetricsRadio" value="CHANT" class="accent-black"><span id="opt_c1_chant">Chanting Guess Rate</span></label>
                            </div>
                            <label class="flex items-center gap-1 cursor-pointer font-bold">
                                <input type="radio" name="tierChartGroupRadio" value="C2" class="accent-black">
                                <span id="label_group_c2">Contribution</span>
                            </label>
                            <label class="flex items-center gap-1 cursor-pointer font-bold">
                                <input type="radio" name="tierChartGroupRadio" value="C3" class="accent-black">
                                Time
                            </label>
                            <div class="pl-2 flex flex-col gap-0.5 border-l-2 border-gray-200 ml-1">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierTimeRadio" value="MIN" class="accent-black">Minimum</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierTimeRadio" value="MEAN" class="accent-black">Mean</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierTimeRadio" value="MED" class="accent-black">Median</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierTimeRadio" value="MAX" class="accent-black">Maximum</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="tierTimeRadio" value="STDEV" class="accent-black">Standard Deviation</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="guessSettingsDropdown" class="bg-white border p-4 w-44 absolute right-0 top-[32px] hidden z-50 shadow-md text-left text-xs text-black flex flex-col gap-1">
                    <div>
                        <p class="font-bold border-b pb-1 mb-1">Display</p>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="guessDisplayRadio" value="ALL" checked class="accent-black">Corrects</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="guessDisplayRadio" value="RIG" class="accent-black">Rigs</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="guessDisplayRadio" value="HIT" class="accent-black">Rigs Hit</label>
                    </div>
                    <div class="mt-1">
                        <p class="font-bold border-b pb-1 mb-1">Focus</p>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="guessFocusRadio" value="ON" class="accent-black">On</label>
                        <label class="flex items-center gap-1 cursor-pointer py-0.5"><input type="radio" name="guessFocusRadio" value="OFF" checked class="accent-black">Off</label>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div id="player-tab" class="tab-content active-content">
                <div class="w-full flex justify-center mb-1">
                    <div class="mx-auto w-full max-w-xl flex items-center justify-center gap-1">
                        <input type="text" id="playerSearchInput" placeholder="guessrate<40 or score>50" class="w-full h-[30px] px-2 border text-sm">
                        <div id="playerSearchCounter" class="w-[75px] h-[30px] font-bold bg-black text-white flex items-center justify-center text-sm select-none shrink-0">
                            0/0
                        </div>
                    </div>
                </div>
                <div class="w-full overflow-x-auto block">
                    <table class="main-table" id="playerStandingsTable"></table>
                </div>
            </div>
            <div id="tour-tab" class="tab-content">
                <div class="table-center-wrapper">
                    <table class="main-table" id="tourStatsTable"></table>
                    <div id="teamTableSpacer" class="my-1"></div>
                    <table class="main-table" id="teamStatsTable"></table>
                </div>
            </div>
        </div>
        <div class="max-w-[2000px] mx-auto"> 
            <div id="tier-tab" class="tab-content">
                <div class="max-w-[1000px] mx-auto">
                    <div id="container_tierChart_MainMetrics">
                        <div id="tierChart_MainMetrics"></div>
                    </div>
                    <div id="container_tierChart_LivesMetrics" class="hidden">
                        <div id="tierChart_LivesMetrics"></div>
                    </div>
                    <div id="container_tierChart_TimeMetrics" class="hidden">
                        <div id="tierChart_TimeMetrics"></div>
                    </div>
                </div>
            </div>
            <div id="song-tab" class="tab-content">
                <div class="max-w-[800px] mx-auto">
                    <div id="plotlySongChart" style="width:800px; height:800px;"></div>
                </div>
            </div>
            <div id="guess-tab" class="tab-content">
                <div class="max-w-[800px] mx-auto pt-2">
                    <div>
                        <div id="guessChartContainer">
                            <div id="plotlyGuessChart" style="width:800px; height:800px;"></div>
                        </div>
                        <div id="listChartContainer" class="hidden">
                            <div id="plotlyListChart" style="width:800px; height:800px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="search-tab" class="tab-content">
                <div class="w-full flex justify-center mb-1">
                    <div class="mx-auto w-full max-w-xl flex items-center justify-center gap-1">
                        <input type="text" id="songSearchInput" placeholder="anime:chobits songtype:ed" class="w-full h-[30px] px-2 border text-sm">
                        <div id="searchCounter" class="w-[75px] h-[30px] font-bold bg-black text-white flex items-center justify-center shrink-0 text-sm">
                            0/0
                        </div>
                    </div>
                </div>
                <div class="w-full overflow-x-auto block">
                    <table class="main-table" id="searchSongsTable"></table>
                </div>
            </div>
        </div>
        <script>fetch('Data.json')
            .then(response => response.json())
            .then(data => {
                window.dashboardData = data;
                const script = document.createElement('script');
                script.src = "Script.js";
                document.body.appendChild(script);
            })
            .catch(err => console.error("Could not trace configuration database mapping initialization payload :", err));
        </script>
    </body>
</html>
